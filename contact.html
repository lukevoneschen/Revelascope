<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Revelascope</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="aperture-bg" aria-hidden="true">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#293748" stroke-width="2">
      <circle cx="100" cy="100" r="88"/>
      <circle cx="100" cy="100" r="78"/>
      <g>
        <path d="M100 22 A78 78 0 0 1 167 61 L100 100 Z"/>
        <path d="M167 61 A78 78 0 0 1 167 139 L100 100 Z"/>
        <path d="M167 139 A78 78 0 0 1 100 178 L100 100 Z"/>
        <path d="M100 178 A78 78 0 0 1 33 139 L100 100 Z"/>
        <path d="M33 139 A78 78 0 0 1 33 61 L100 100 Z"/>
        <path d="M33 61 A78 78 0 0 1 100 22 L100 100 Z"/>
      </g>
    </g>
  </svg>
</div>

<header class="site">
  <div class="navbar">
    <a class="logo-link" href="index.html"><img src="logo.png" alt="Revelascope"></a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main class="frame">
  <div class="inner">
    <span class="eyebrow">Contact</span>
    <h1>Get in touch</h1>
    <p class="sub">For partnership, investment, clinical collaboration, or press inquiries.</p>

    <form id="signup-form" class="contact-form" name="revelascope-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="revelascope-interest">
      <p style="display:none;"><label>Don't fill this out: <input name="bot-field"></label></p>
      <input type="email" name="email" placeholder="you@email.com" required aria-label="Email address">
      <button type="submit" class="btn">Get in touch</button>
    </form>
    <p class="confirm" id="confirm-msg">Thanks — we'll be in touch.</p>
  </div>
</main>

<script>
  const form = document.getElementById('signup-form');
  const confirmMsg = document.getElementById('confirm-msg');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const data = new FormData(form);
    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(data).toString()
    }).then(() => {
      form.style.display = 'none';
      confirmMsg.style.display = 'block';
    }).catch(() => { form.submit(); });
  });
</script>

</body>
</html>
